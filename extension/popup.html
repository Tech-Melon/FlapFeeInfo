<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>技术瓜FlapFeeInfo</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="title">技术瓜FlapFeeInfo</div>
      <div class="sub">徽章显示与主题（即时生效）</div>
    </header>

    <section class="section">
      <div class="section-title">颜色主题</div>
      <div class="theme-seg" role="group" aria-label="徽章颜色主题">
        <button type="button" class="theme-btn" data-theme="dark" id="themeDark">
          <span class="theme-dot theme-dot-dark"></span>
          深色
          <span class="theme-tag">默认</span>
        </button>
        <button type="button" class="theme-btn" data-theme="light" id="themeLight">
          <span class="theme-dot theme-dot-light"></span>
          浅色
        </button>
      </div>
      <p class="theme-hint">深色适配 GMGN/Debot 黑底；浅色为实心浅底，对比更强。</p>
    </section>

    <section class="section">
      <div class="section-title">显示项（默认全部开启）</div>
      <div class="list" id="prefList"></div>
    </section>

    <section class="section">
      <div class="section-title">徽章位置（相对默认挂载点）</div>
      <p class="theme-hint offset-hint">
        在卡片原有挂载基础上微调偏移；同一站点所有徽章共用一套坐标。GMGN 与 Debot/Gungnir 分开保存。非拖拽实时重绘，改完后写入本地，下一轮绘制或刷新生效。
      </p>
      <div class="offset-site" data-site="gmgn">
        <div class="offset-site-title">GMGN</div>
        <div class="offset-row">
          <label class="offset-axis">X
            <input type="number" class="offset-input" data-site="gmgn" data-axis="x" min="-200" max="200" step="1" value="0" />
            <span class="offset-unit">px</span>
          </label>
          <div class="offset-step">
            <button type="button" class="btn-step" data-site="gmgn" data-axis="x" data-delta="-4">−</button>
            <button type="button" class="btn-step" data-site="gmgn" data-axis="x" data-delta="4">+</button>
          </div>
        </div>
        <div class="offset-row">
          <label class="offset-axis">Y
            <input type="number" class="offset-input" data-site="gmgn" data-axis="y" min="-200" max="200" step="1" value="0" />
            <span class="offset-unit">px</span>
          </label>
          <div class="offset-step">
            <button type="button" class="btn-step" data-site="gmgn" data-axis="y" data-delta="-4">−</button>
            <button type="button" class="btn-step" data-site="gmgn" data-axis="y" data-delta="4">+</button>
          </div>
        </div>
      </div>
      <div class="offset-site" data-site="debot">
        <div class="offset-site-title">Debot / Gungnir</div>
        <div class="offset-row">
          <label class="offset-axis">X
            <input type="number" class="offset-input" data-site="debot" data-axis="x" min="-200" max="200" step="1" value="0" />
            <span class="offset-unit">px</span>
          </label>
          <div class="offset-step">
            <button type="button" class="btn-step" data-site="debot" data-axis="x" data-delta="-4">−</button>
            <button type="button" class="btn-step" data-site="debot" data-axis="x" data-delta="4">+</button>
          </div>
        </div>
        <div class="offset-row">
          <label class="offset-axis">Y
            <input type="number" class="offset-input" data-site="debot" data-axis="y" min="-200" max="200" step="1" value="0" />
            <span class="offset-unit">px</span>
          </label>
          <div class="offset-step">
            <button type="button" class="btn-step" data-site="debot" data-axis="y" data-delta="-4">−</button>
            <button type="button" class="btn-step" data-site="debot" data-axis="y" data-delta="4">+</button>
          </div>
        </div>
      </div>
      <div class="offset-actions">
        <button type="button" id="btnOffsetReset" class="btn btn-muted">重置全部偏移</button>
      </div>
      <p class="status" id="offsetStatus" aria-live="polite"></p>
    </section>

    <footer class="foot">
      <button type="button" id="btnAllOn" class="btn">全部开启</button>
      <button type="button" id="btnAllOff" class="btn btn-muted">全部关闭</button>
    </footer>
    <p class="hint">主题/显示项即时刷新；位置偏移写入后由页面侧下一轮绘制应用（已打开页会同步 CSS 偏移）。</p>

    <script src="popup.js"></script>
  </body>
</html>
